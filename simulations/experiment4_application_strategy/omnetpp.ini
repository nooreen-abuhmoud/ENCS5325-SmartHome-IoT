# ==========================================================
# Experiment 4 - Application Strategy Comparison
# Request/Response (Polling) vs Publish/Subscribe-like
# ==========================================================

[Config Common]
network = simulations.experiment4_application_strategy.ApplicationStrategyNetwork
abstract = true

sim-time-limit = 600s

# Fixed topology size for fair comparison
*.numSensors = 12

# ----------------------------------------------------------
# Network configuration
# ----------------------------------------------------------

**.arp.typename = "GlobalArp"
**.netmaskRoutes = ""

*.radioMedium.backgroundNoise.power = -110dBm

*.configurator.config = xmldoc("startopology.xml")
*.configurator.addStaticRoutes = false

# ----------------------------------------------------------
# Sensor positions
# ----------------------------------------------------------

*.sensor[*].mobility.initFromDisplayString = false
*.sensor[*].mobility.initialX = uniform(1m, 19m)
*.sensor[*].mobility.initialY = uniform(1m, 19m)
*.sensor[*].mobility.initialZ = 0m

# Gateway only forwards packets
*.controller.numApps = 0

# Actuators are inactive in this experiment
*.lamp*.numApps = 0

# We only need scalar/statistical results here.
# Disable large vector files to save disk space.
**.vector-recording = false


# ==========================================================
# A) REQUEST / RESPONSE - POLLING
# ==========================================================

[Config RequestResponseBase]
extends = Common
abstract = true

# Each sensor acts as a UDP echo server
*.sensor[*].numApps = 1
*.sensor[*].app[0].typename = "UdpEchoApp"
*.sensor[*].app[0].localPort = 2000

# Monitoring server polls all 12 sensors
*.monitoringServer.numApps = 12

*.monitoringServer.app[*].typename = "UdpBasicApp"
*.monitoringServer.app[*].destPort = 2000
*.monitoringServer.app[*].messageLength = 50B
*.monitoringServer.app[*].sendInterval = 10s
*.monitoringServer.app[*].startTime = uniform(1s,2s)
*.monitoringServer.app[*].packetName = "PollingRequest"

# One polling application per sensor
*.monitoringServer.app[0].destAddresses  = "sensor[0]"
*.monitoringServer.app[1].destAddresses  = "sensor[1]"
*.monitoringServer.app[2].destAddresses  = "sensor[2]"
*.monitoringServer.app[3].destAddresses  = "sensor[3]"
*.monitoringServer.app[4].destAddresses  = "sensor[4]"
*.monitoringServer.app[5].destAddresses  = "sensor[5]"
*.monitoringServer.app[6].destAddresses  = "sensor[6]"
*.monitoringServer.app[7].destAddresses  = "sensor[7]"
*.monitoringServer.app[8].destAddresses  = "sensor[8]"
*.monitoringServer.app[9].destAddresses  = "sensor[9]"
*.monitoringServer.app[10].destAddresses = "sensor[10]"
*.monitoringServer.app[11].destAddresses = "sensor[11]"

# Result recording
# Requests generated by monitoring server
*.monitoringServer.app[*].packetSent.result-recording-modes = count

# Responses successfully received by monitoring server
*.monitoringServer.app[*].packetReceived.result-recording-modes = count

# Round-trip time
*.monitoringServer.app[*].rcvdPkLifetime.result-recording-modes = stats

# Responses generated by sensors
*.sensor[*].app[0].echoedPk.result-recording-modes = count


# ----------------------------------------------------------
# Request/Response configurations
# ----------------------------------------------------------

[Config RR_T1]
extends = RequestResponseBase
*.monitoringServer.app[*].sendInterval = 1s
repeat = 5
seed-set = ${repetition}

[Config RR_T5]
extends = RequestResponseBase
*.monitoringServer.app[*].sendInterval = 5s
repeat = 5
seed-set = ${repetition}

[Config RR_T10]
extends = RequestResponseBase
*.monitoringServer.app[*].sendInterval = 10s
repeat = 5
seed-set = ${repetition}

[Config RR_T30]
extends = RequestResponseBase
*.monitoringServer.app[*].sendInterval = 30s
repeat = 5
seed-set = ${repetition}

[Config RR_T60]
extends = RequestResponseBase
*.monitoringServer.app[*].sendInterval = 60s
repeat = 5
seed-set = ${repetition}


# ==========================================================
# B) PUBLISH / SUBSCRIBE-LIKE
# ==========================================================

[Config PublishSubscribeBase]
extends = Common
abstract = true

# Sensors publish updates directly to the subscriber
*.sensor[*].numApps = 1

*.sensor[*].app[0].typename = "UdpBasicApp"
*.sensor[*].app[0].destAddresses = "monitoringServer"
*.sensor[*].app[0].destPort = 3000
*.sensor[*].app[0].messageLength = 50B
*.sensor[*].app[0].sendInterval = 10s
*.sensor[*].app[0].startTime = uniform(1s,2s)
*.sensor[*].app[0].packetName = "SensorPublication"

# Monitoring server acts as subscriber
*.monitoringServer.numApps = 1
*.monitoringServer.app[0].typename = "UdpSink"
*.monitoringServer.app[0].localPort = 3000

# Result recording
*.sensor[*].app[0].packetSent.result-recording-modes = count

*.monitoringServer.app[0].packetReceived.result-recording-modes = count

*.monitoringServer.app[0].endToEndDelay.result-recording-modes = +stats


# ----------------------------------------------------------
# Publish/Subscribe configurations
# ----------------------------------------------------------

[Config PUB_T1]
extends = PublishSubscribeBase
*.sensor[*].app[0].sendInterval = 1s
repeat = 5
seed-set = ${repetition}

[Config PUB_T5]
extends = PublishSubscribeBase
*.sensor[*].app[0].sendInterval = 5s
repeat = 5
seed-set = ${repetition}

[Config PUB_T10]
extends = PublishSubscribeBase
*.sensor[*].app[0].sendInterval = 10s
repeat = 5
seed-set = ${repetition}

[Config PUB_T30]
extends = PublishSubscribeBase
*.sensor[*].app[0].sendInterval = 30s
repeat = 5
seed-set = ${repetition}

[Config PUB_T60]
extends = PublishSubscribeBase
*.sensor[*].app[0].sendInterval = 60s
repeat = 5
seed-set = ${repetition}